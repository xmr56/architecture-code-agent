apiVersion: apps/v1
kind: Deployment
metadata:
  name: spacefractions
  labels:
    app: spacefractions
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spacefractions
  template:
    metadata:
      labels:
        app: spacefractions
    spec:
      containers:
        - name: spacefractions
          image: spacefractions:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
