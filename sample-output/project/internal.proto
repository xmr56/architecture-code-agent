syntax = "proto3";

package spacefractions;

// Internal RPC contract between GameComponent and QuestionComponent.
service GameService {
  rpc Play(PlayRequest) returns (PlayResponse) {}
  rpc SubmitAnswer(SubmitAnswerRequest) returns (SubmitAnswerResponse) {}
}

message PlayRequest {
  int32 gameId = 1;
}

message PlayResponse {
  int32 gameId = 1;
  string state = 2;
  int32 totalQuestions = 3;
  Question firstQuestion = 4;
}

message SubmitAnswerRequest {
  int32 gameId = 1;
  string answer = 2;
}

message SubmitAnswerResponse {
  int32 gameId = 1;
  bool correct = 2;
  bool gameOver = 3;
  Score score = 4;
}

message Question {
  int32 id = 1;
  string prompt = 2;
  repeated string options = 3;
}

message Score {
  int32 correct = 1;
  int32 total = 2;
}
